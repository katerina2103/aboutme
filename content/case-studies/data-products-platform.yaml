title: Define once. Onboard faster. Scale across Europe
context: Regulated B2B · Customer-facing data platform
problem: >-
  Collecting regulated data across Europe meant navigating EU and national regulations alongside each controller’s internal standards and data formats. As the portfolio grew, we needed to accommodate these differences without repeatedly rebuilding and customizing ingestion processes.
solution: >-
  I have led the initiative to standardize and modernize data management processes that would accomodate for this variaty without compromising scalability. I embedded data-quality and standards into the platform design through machine and human readable intent. My platform leadership principle remained 'eat your own dogfood' - to focus on data content, while continuosly improving the underlying infrastructure.
impact: >-
  With data requirements defined upfront, the platform enabled teams to configure up to seven ingestion pipelines in a single day. It ultimately scaled to 39 pipelines, serving more than 200 healthcare providers across Europe, also using the platform as a front-end application.

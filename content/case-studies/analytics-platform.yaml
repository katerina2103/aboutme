title: Scaling analytics through software development practices
context: Elsevier · Shared analytics platform
problem: >-
  Analytics needed to support more teams across the organisation, while access to eligible data could take weeks or months.
solution: >-
  I helped scale a shared Tableau platform across global teams and reduce the wait for eligible data access.
impact: >-
  The platform reached more than 20 global teams and 2,000 monthly users, with over 1,500 dashboards. Eligible data-access waits fell from weeks or months to around one day.

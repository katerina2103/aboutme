title: Remove barriers to scale analytics
context: Enterprise · Analytics platform
problem: Analysts had the tools, but lacked the guidance and guardrails to use them reliably. Some
  spent weeks working through the details of the vendor implementation before they could produce
  insights. We needed to support growing demand and control costs while helping people get on with
  their work.
solution: I raised the problem even though it sat outside my remit. I documented the current setup
  and brought experienced analysts together to work through the friction and define an experiment.
  We tested, evaluated and then expanded adoption in batches. Community calls, drop-in sessions and
  written guidance made learning available to more teams. With the squad, I introduced automated
  governance controls so we could monitor use and keep improving the platform.
impact: The platform reached more than 20 global teams and 2,000 monthly users, with over 1,500
  dashboards. Analysts had more support, and platform SLAs improved. The work connected adoption
  with the guidance and governance needed to sustain it.
principles:
  - make-value-concrete
  - show-participation-matters
  - adapt-and-persist

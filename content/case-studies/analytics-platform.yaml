title: Remove barriers to scale analytics
context: Enterprise · Analytics platform
problem: Analysts had the tools but lacked the guidance and guardrails to use them reliably. Some
  spent weeks working through the details of the vendor implementation before they could produce
  insights. We needed to support growing demand and control costs while helping people get on with
  their work.
solution: I raised the problem even though it sat outside my remit. Using platform logs to identify participants, I engaged with more than 40 users, documented the current state,
  and brought experienced analysts together to define and evaluate a potential solution.
  We first designed and evaluated the solution in our working group, improved it based on feedback, and then expanded adoption in batches. Community calls, drop-in sessions, and
  written guidance made learning available to more teams. With the team, I introduced automated
  governance controls so we could monitor use and keep improving the platform.
impact: The platform reached more than 20 global teams across Europe and the US, serving 2,000 monthly users who gathered insights from more than 1,500
  dashboards. Analysts had platform access within one working day instead of spending weeks searching, felt supported, and saw platform SLAs improve by at least 2x. The work combined adoption with the guidance and governance needed to sustain it, helping the enterprise become more data-driven.
principles:
  - make-value-concrete
  - show-participation-matters
  - adapt-and-persist

title: Build learning into every launch
context: Discovery leadership · Data platform · 4 squads
problem: |
  Our platform was at the MVP stage and approaching a wider customer launch. Before rolling it out to everyone, we needed to understand how users experienced it in practice and how we could make the data management process simpler.
solution: |
  While leading four squads, I introduced a series of small pilots before the wider rollout. Product owners worked alongside customer services to guide users, then held open-ended interviews after a short period of use to understand the experience.
  This approach was applied across nearly 20 customers using various data pipelines. For efficiency, AI tools helped analyze and annotate the interviews. We then turned the insights into rapid AI-assisted prototypes. Testing those prototypes with users helped to improve the journey before committing to further development.
impact: |
  The feedback informed a simpler user journey, improved satisfaction, and helped reduce the codebase to around 65% of its original size. Pilot users also welcomed the early product preview and genuine interview process, and recognized some of their feedback in the improvements.
  Beyond the improvements themselves, I introduced a repeatable customer-centric product discovery practice: put yourself in customers' shoes, listen carefully, iterate quickly, and substantiate launch decisions. The experience has strengthened the product-led culture.
principles:
  - understand-before-change
  - bring-people-into-change
  - question-behind-the-question

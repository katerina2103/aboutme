title: Build learning into every launch
context: Discovery leadership · Healthcare data platform · 4 squads
problem: |
  Our platform was at MVP stage, approaching a wider customer launch. Before rolling it out to everyone, we needed to understand how hospital users experienced it in practice and where the journey needed to be simpler.
solution: |
  While leading four squads, I introduced a smaller pilot before the wider rollout. Platform team members worked alongside Customer Services to support users, then held open interviews after a short period of use.

  We applied this approach across nearly 20 hospitals and three data pipelines. We used AI to help analyse and annotate the interviews, then turned the findings into rapid AI-assisted prototypes. Testing those prototypes with users helped us decide what to simplify before committing to further development.
impact: |
  The feedback informed a simpler user journey and helped reduce the codebase to around 65% of its original size.

  Beyond the improvements themselves, I introduced a repeatable discovery practice: support users in context, listen to their experience, test changes quickly and bring that learning into launch decisions.
principles:
  - understand-before-change
  - bring-people-into-change
  - question-behind-the-question

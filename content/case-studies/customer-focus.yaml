title: Give users control over their data
context: Regulated industries · Data platform
problem: Data providers submitted information through a portal with little visibility into what
  happened next. Routine data-management tasks depended on internal teams. Before adding more
  features, we needed to understand which tasks users could handle themselves and what guidance
  would make that practical.
solution: I helped redesign submission and data management around the work users needed to do. We
  used several rounds of discovery and testing to improve guided loading, validation and correction.
  The aim was to give people useful control over their data, with feedback they could act on inside
  the product.
impact: In selected markets, around 70% of data operations shifted to users. They could identify and
  correct issues themselves, with short validation cycles instead of relying on internal teams for
  each step.
principles:
  - understand-before-change
  - bring-people-into-change
  - question-behind-the-question

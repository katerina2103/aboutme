copy:
  deadline: The budget for next financial year closes in a few weeks. My call is
    to get a rough baseline now so I can decide whether it is worth pursuing.
  quick_check: A quick check with five scientists
  tracking: I’d ask five scientists across three departments to track how long it
    takes to find and get access to the information they need during their
    normal work. I want to see where the time goes and which problems come up
    repeatedly.
  budget_heading: What I’d take into the budget discussion
  scale_intro: If the 5–7 hours per scientist per week holds across our 600 researchers, that’s
  scale_value: 3,000–4,200 hours a week
  scale_outro: spent finding and getting access to information. Even freeing up a fraction could give scientists more time for experiments and analysis.
  funding_call: If the same pattern keeps showing up across departments, I’d
    ask for enough funding for a pilot to see how much time we can actually give back.
  method: For each day note how much time was spend getting needed information, jot down what you needed, how long it took to find it,
    and time spent getting access. Note any other blockers.
evidence:
  copy:
    evidence: "Evidence "
    label: "&"
    assumptions: " assumptions"
    size_the_problem: I’d investigate first.
    test_the_assumptions: Which evidence is already available?
  hypothesis:
    label: Our working hypothesis · unproven
    value: 5–7 hours/week
    description: " per researcher searching and collecting information."
  signals_label: External signals worth investigating
  signals:
    - label: Siloed data
      value: 57%
      description: " cited data silos as a barrier to using lab data."
    - label: Complex IT & data landscape
      value: 43%
      description: " supported 20+ scientific applications."
  takeaway:
    label: What I am going to do next
    text: Understand where researchers lose time and what access they need to
      relevant scientific applications in our company before choosing a
      solution. After all as Deming said -  without data you are just another
      person with an opinion.
  details:
    label: Sources, limits & validation
    introduction: These external signals suggest fragmented knowledge is worth
      investigating. They do not establish the company’s problem or prove that
      AI is the right solution.
    sources:
      - label: Pistoia Alliance · September 2025 ↗
        url: https://pistoiaalliance.org/news/survey-ai-adoption-life-sciences-labs-skills-gap/
        limits: . Survey of 200+ experts across life sciences and related sectors; not a
          representative sample of 2,000-person biotechs.
      - label: Benchling · November 2024 ↗
        url: https://www.benchling.com/blog/2024-state-of-tech-report
        limits: . Vendor-sponsored survey of 300 R&D/IT respondents in the US and
          Europe. The 43% figure applies to the large-biopharma IT subgroup
          (1,000+ employees).
    validation: The 5–7 hours is a working hypothesis, not a survey finding. I would
      separate search and collection from waiting, synthesis and correction
      across two weeks of real work.
study:
  copy:
    discovery: "Discovery "
    label: "&"
    experiment: " experiment"
    find_the_friction: Baseline unproven. Let's validate
    discovery_method: Discovery method
    log_search_waiting_synthesis_and_correction_separately: I would observe 12
      researchers across three departments and record search, waiting, synthesis
      and correction separately. Follow the work through ELN/LIMS, file shares
      and expert handoffs. Check whether access rights, metadata or missing
      records cause the delay. This is proposed discovery, not completed
      findings.
    one_candidate_review_workflow_compare_ai_with: One candidate-review workflow.
      Committed participants. Compare AI with improved search and the current
      workflow.
    pilot_design_and_evaluation: Pilot design and evaluation
    use_committed_scientists_and_approved_sources_compare: Agree the scientific
      participants, data owners and decision owner before starting. Use two
      approved sources and matched tasks in randomized order. Include difficult
      and unanswerable questions. Where practical, researchers judge usefulness
      without knowing which tool produced the brief. Measure time after review
      and correction, answer quality and access failures. The result should tell
      us what deserves funding next.
  workflow:
    discovery:
      number: "1"
      title: Find the bottleneck
      scope: 2-week discovery · 12 researchers · 3 departments
      description: Observe real work. Find where time is lost and why.
      output_label: "Output:"
      output: a measured baseline and a task worth improving.
    bridge: The bottleneck defines what the pilot tests.
    pilot:
      number: "2"
      title: Test what helps
      scope: Then an 8-week pilot · 30 researchers · 2 applications · Same task, three
        solutions
      routes:
        - title: Current workflow
          description: Our baseline
        - title: Improved search
          description: Simpler alternative
        - title: AI assistant
          description: Candidate solution
      measures: Compare time after checking and corrections, answer quality, and
        access failures.
    decision_label: "Decision:"
    decision: does AI add enough value over improved search to deserve further funding?
    methods_label: Method & safeguards

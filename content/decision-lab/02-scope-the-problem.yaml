copy:
  deadline: The budget for next financial year closes in a few weeks. My call is
    to get a rough baseline now so I can decide whether it is worth pursuing.
  tracking: I’d ask five scientists across three departments to track how long it
    takes to find and get access to the information they need during their
    normal work. I want to see where the time goes and which problems come up
    repeatedly.
  budget_heading: What I would base my next step on
  scale_intro: When 5–7 hours per scientist per week holds across our 600
    researchers, that’s 3,000–4,200 hours a week spent finding and getting access to information. Even freeing up a
    fraction could give scientists more time for innovation, leave alone employee happiness. If the same pattern keeps showing up across departments, I’d ask
    for enough funding for a pilot to see how much time we can actually give back.
  method: For each day note how much time was spend getting needed information,
    jot down what you needed, how long it took to find it, and time spent
    getting access. Note any other blockers.
evidence:
  hypothesis:
    value: Assuming 5–7 hours/week
  details:
    introduction: These external signals suggest fragmented knowledge is worth
      investigating. They do not establish the company’s problem or prove that
      AI is the right solution.
    sources:
      - label: Pistoia Alliance · September 2025 ↗
        url: https://pistoiaalliance.org/news/survey-ai-adoption-life-sciences-labs-skills-gap/
        limits: . Survey of 200+ experts across life sciences and related sectors; not a
          representative sample of 2,000-person biotechs.
      - label: Benchling · November 2024 ↗
        url: https://www.benchling.com/blog/2024-state-of-tech-report
        limits: . Vendor-sponsored survey of 300 R&D/IT respondents in the US and
          Europe. The 43% figure applies to the large-biopharma IT subgroup
          (1,000+ employees).

details:
  label: Sources, limits & validation
  introduction: These external signals suggest fragmented knowledge is worth investigating. They do
    not establish this company’s problem or prove that AI is the right solution.
  sources:
    - label: Pistoia Alliance · September 2025 ↗
      url: https://pistoiaalliance.org/news/survey-ai-adoption-life-sciences-labs-skills-gap/
      limits: . Survey of 200+ experts across life sciences and related sectors; not a representative
        sample of 2,000-person biotechs.
    - label: Benchling · November 2024 ↗
      url: https://www.benchling.com/blog/2024-state-of-tech-report
      limits: . Vendor-sponsored survey of 300 R&D/IT respondents in the US and Europe. The 43% figure
        applies to the large-biopharma IT subgroup (1,000+ employees).
  validation: The 5–7 hours is a planning assumption, not a survey finding. I would separate search
    and collection from waiting, synthesis and correction across two weeks of real work.

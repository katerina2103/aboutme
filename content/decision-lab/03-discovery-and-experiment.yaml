  pilot_design_and_evaluation: Pilot design and evaluation
  use_committed_scientists_and_approved_sources_compare: Agree the scientific participants, data
    owners and decision owner before starting. Use two approved sources and matched tasks in
    randomized order. Include difficult and unanswerable questions. Where practical, researchers
    judge usefulness without knowing which tool produced the brief. Measure time after review and
    correction, answer quality and access failures. The result should tell us what deserves funding
    next.

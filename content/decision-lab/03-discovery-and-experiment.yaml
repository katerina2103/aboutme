  log_search_waiting_synthesis_and_correction_separately: I would observe 12 researchers across three
    departments and record search, waiting, synthesis and correction separately. Follow the work
    through ELN/LIMS, file shares and expert handoffs. Check whether access rights, metadata or
    missing records cause the delay. This is proposed discovery, not completed findings.
  one_candidate_review_workflow_compare_ai_with: One candidate-review workflow. Committed

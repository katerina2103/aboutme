  year_1_establish_the_permission_model_source: "Year 1: establish the permission model, source-linked
    briefs and evaluation suite; release in stages after the pilot. Year 2: test transfer to a
    second team before extending source coverage. Measure reuse effort and time to first trustworthy
    brief. Year 3: expand only to workflows that demonstrate repeatable value; strengthen
    monitoring, support and cost controls."
  illustrative_average_annual_adoption_across_600_eligible: "*Illustrative average annual adoption
    across 600 eligible scientists, not commitments or end-of-year targets. Adoption requires phased
    rollout beyond the original 30 pilot participants. Each year’s funding is conditional on
    evidence; no automatic three-year approval."

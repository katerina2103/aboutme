  i_d_keep_funding_the_two: "I’d keep funding the two workflows that earn their place. For the third, I’d compare the cost of doing nothing, asking the vendor, and owning a small extension. I’d approve a test only if researchers can show a recurring cost or delay that the extension could remove."

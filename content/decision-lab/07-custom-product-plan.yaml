  meet_the_pilot_s_value_quality_and: Meet the pilot’s value, quality and access gates—and demonstrate
    a repeatable scientific need that vendors cannot meet economically. A successful AI pilot alone
    does not justify a custom build.
  product_vision: Product vision
  trustworthy_scientific_evidence_ready_for_the_next: Trustworthy scientific evidence, ready for the next research decision.
  help_scientists_create_source_linked_candidate_review: Help scientists create source-linked candidate-review briefs across approved knowledge sources.
  users_value_and_product_boundaries: Users, value and product boundaries
  serve_scientists_and_research_decision_owners_connect: Serve scientists and research decision
    owners. Connect evidence to its source, preserve permissions and make uncertainty visible.
    Measure net preparation time, brief quality and repeat use. Start with one candidate-review
    workflow; autonomous scientific decisions and foundation-model training are outside scope.
  strategy: Strategy
  own_the_scientific_workflow_reuse_the_technology: Own the scientific workflow. Reuse the technology.
  build_only_the_differentiated_layer_use_existing: Build only the differentiated layer; use existing models and retrieval components.
  choices_dependencies_and_success_measures: Choices, dependencies and success measures
  own_evidence_templates_workflow_evaluations_and_integrations: Own evidence templates, workflow,
    evaluations and integrations where the pilot proves vendor gaps. Use existing models and
    reusable retrieval tools. Prioritize permission-aware access, traceability and supportability
    over feature breadth. Commit scientific owners, senior engineering and data owners before
    delivery.
  continue_only_while_net_preparation_time_improves: Continue only while net preparation time improves
    by at least 20% versus improved search without material quality loss, material claims remain
    verifiable and adversarial tests show no unauthorized disclosure. Review ongoing quality,
    adoption, incidents and full ownership cost quarterly. Stop or change approach if benefits fail
    to persist.

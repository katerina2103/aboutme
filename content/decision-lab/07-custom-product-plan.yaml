  the_simulated_pilot_had_62_5: "The simulated pilot had 62.5% repeat usage (15 of 24 researchers) and a six-minute reduction in median time per verified answer (20 to 14 minutes). Apply both figures to the two covered workflows. At an assumed 10 comparable tasks per active researcher per week over 46 weeks, that projects one hour per active researcher per week. We still need to verify task frequency and sustained usage after rollout. The euro amounts represent the value of researcher time. They sit outside the P&L. Assess any extension on the additional benefit beyond the two workflows Glean already covers, including what we’d spend to build and maintain it and what work would be delayed."

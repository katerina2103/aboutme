  value_3_year_cost_3_30m_gross_capacity: "3-year cost: €3.30m · gross capacity value: ~€2.70m"
  model_assumptions_and_investment_conclusion: Model assumptions and investment conclusion
  team_8_fte_120k_loaded_annual_cost: "Team: 8 FTE × €120k loaded annual cost = €960k/year, within the
    earlier custom-build staffing and cost range. Infrastructure/API: €100k / €140k / €180k as usage
    expands. Assume all development costs are expensed; no capitalization, depreciation, financing
    or tax model. No external sales or internal chargebacks. This is an incremental internal
    cost-centre view, not a company-wide P"
  label_3: "&"
  l_3: L.
  the_80_150k_pilot_is_assumed_included: The €80–150k pilot is assumed included in Year 1’s team/tool
    envelope, not added again. Confirm the same scope before approval. Major data remediation, VAT
    and whole-platform replacement remain excluded. Allocated staff expense is not necessarily
    incremental cash spending.
  capacity_calculation_600_scientists_46_weeks_average: "Capacity calculation: 600 scientists × 46
    weeks × average adoption of 30% / 50% / 60% × 1 net hour saved per active scientist/week ×
    assumed €70/hour. This yields 8,280 / 13,800 / 16,560 annual hours. The 1-hour net benefit is a
    hypothesis to validate after review effort, not an experimental result. Capacity is not revenue,
    payroll savings or realized cash benefit."
  on_these_assumptions_gross_three_year_capacity: "On these assumptions, gross three-year capacity
    value is about €2.70m against €3.30m of expense: capacity value alone does not justify custom
    ownership. Require evidenced additional scientific value, better economics or a lower-cost route
    before committing. Do not count research milestone gains twice. No cash payback or ROI is
    established by this model."

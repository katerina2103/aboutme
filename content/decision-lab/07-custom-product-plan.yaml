  only_proceed_if_the_experiment_earns_it: Only proceed if the experiment earns it
  meet_the_pilot_s_value_quality_and: Meet the pilot’s value, quality and access criteria, then
    demonstrate a recurring scientific need vendors cannot meet economically. A successful pilot
    tells us the approach has promise. It does not automatically justify a custom product.
  product_vision: Product vision
  trustworthy_scientific_evidence_ready_for_the_next: Help researchers reach the next research decision with evidence they can trace and check.
  help_scientists_create_source_linked_candidate_review: Help researchers create source-linked candidate-review briefs across approved knowledge sources.
  users_value_and_product_boundaries: Users, value and product boundaries
  serve_scientists_and_research_decision_owners_connect: Serve researchers and research decision
    owners. Connect evidence to its source, preserve permissions and make uncertainty visible.
    Measure net preparation time, brief quality and repeat use. Start with one candidate-review
    workflow; autonomous scientific decisions and foundation-model training are outside scope.
  strategy: Strategy
  own_the_scientific_workflow_reuse_the_technology: Own the scientific workflow. Reuse the technology.
  build_only_the_differentiated_layer_use_existing: Own the scientific workflow where it creates
    value. Use existing models and retrieval components for the rest.
  choices_dependencies_and_success_measures: Choices, dependencies and success measures
  own_evidence_templates_workflow_evaluations_and_integrations: Own the templates, workflow,
    evaluations and integrations where the pilot demonstrates a meaningful vendor gap. Prioritize
    permission-aware access, traceability and supportability. Commit scientific owners, engineering
    and data owners before delivery. Share what the team learns so the next workflow starts with
    evidence rather than another blank page.
  continue_only_while_net_preparation_time_improves: Continue only while net preparation time improves
    by at least 20% versus improved search without material quality loss, material claims remain
    verifiable and adversarial tests show no unauthorized disclosure. Review ongoing quality,
    adoption, incidents and full ownership cost quarterly. Stop or change approach if benefits fail
    to persist.

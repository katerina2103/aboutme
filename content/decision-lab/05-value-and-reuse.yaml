  research_milestone_24_weeks_baseline_22_to: "Research milestone: 24-week baseline; 22 to 23 weeks
    if preparation is on the critical path, otherwise no gain, on a zero-to-24-week scale."
  value_0_3: "0"
  value_24_weeks: 24 weeks
  blue_ranges_assumed_outcomes_with_reuse_navy: Blue ranges = assumed outcomes with reuse; navy
    markers = baseline. Each row has its own scale. *No milestone gain if wet-lab work or approvals
    determine delivery.
  what_earns_the_next_investment: What earns the next investment?
  validate_sustained_adoption_and_net_time_saved: Fund a pilot to test whether the shortlisted vendor
    saves researchers time after review compared with improved search, and whether they keep using
    it. Use measured value and a full supplier quote to decide the next investment. Validate reuse
    separately with a second team; do not count milestone gains again as annual capacity.
  assumptions_calculation_and_limits: Assumptions, calculation and limits
  annual_capacity_600_scientists_46_weeks_adoption: "Annual capacity = 600 researchers × 46 weeks ×
    adoption × (weekly search hours × reduction − added weekly review hours). Cautious: 40%, 5h,
    15%, 0.5h = 2,760h. Working: 60%, 6h, 25%, 0.5h = 16,560h. Upside: 80%, 7h, 35%, 0.4h = 45,264h.
    Scenario points use unrounded values on a zero-based scale; labels are rounded."
  the_5_7h_baseline_and_15_35: The 5–7h baseline and 15–35% reduction are assumptions, not study
    averages or pilot results. At an assumed €70/hour, gross capacity value is about €0.2m / €1.2m /
    €3.2m before ongoing costs. This is opportunity cost, not payroll savings, revenue or financial
    return. Budget is only released through an explicit redeployment or spending decision.
  reuse_assumes_connectors_access_rules_evidence_templates: Reuse assumes connectors, access rules,
    evidence templates and evaluation sets transfer to a new product line of 100 researchers. A
    16-week evidence-workflow baseline could become 10–14 weeks. New data formats, scientific
    entities or permissions could eliminate the gain.
  a_24_week_research_milestone_could_shorten: A 24-week research milestone could shorten by 1–2 weeks
    if four weeks of evidence preparation sit on the critical path and fall by 25–50%. If wet-lab
    work or approvals dominate, milestone gain is zero. Each reuse row has its own zero-based weeks
    scale. Blue ranges show assumed outcomes, not forecasts.
  validate_adoption_search_time_and_review_cost: "Validate adoption, search time and review cost in
    the pilot. Test transfer to a second team. Do not add milestone gains to annual capacity: the
    same benefit may be counted twice."

sequence:
  step: "Pilot plan"
  title: "What would I fund to test Glean?"
  intro: "Fictional case. I’d run a 12-week pilot with 24 researchers to find out whether Glean helps them get to a verified answer faster on the lab workflows they rely on."
  ceo_ask: "My ask to the CEO: budget and four people for one quarter"
  investment_label: "Investment: €120k–€178k."
  investment_basis: "This planning range assumes 4 full-time team members for 3 months at €10k–€14k per person per month (€120k–€168k), plus €0–€10k for tools. It excludes unquoted Glean fees. I’d get the supplier quote before asking for approval of the full amount."
  capacity_label: "Capacity: four people full-time for 12 weeks."
  capacity_impact: "The tiger team would step away from its existing work for the quarter. With their managers, I’d document what would slip, who would be affected, and the revised dates. I’d ask the CEO to approve those changes alongside the budget."
  tradeoff_label: "Example trade-off."
  tradeoff: "Delay the new ServiceNow self-service portal for routine lab IT requests by one quarter. Researchers would keep using the existing help desk to request software or report workstation issues. I’d protect work tied to regulated lab systems and safety-critical support."
  who_i_d_ask_to_run: "Who I’d ask to run the pilot"
  team_intro: "I’d ask who wants to spend a quarter on the pilot. People can come from any team. I need"
  team_roles: "1 product manager, 2 senior engineers and 1 junior engineer"
  i_d_ask_their_managers_to: ". I’d ask their managers to confirm which commitments would move and who would be affected."
  setup_weeks: "Weeks 1–3:"
  setup_work: "Agree with 24 researchers which tasks to test, time how they do them today, and get approval to connect the sources they need."
  test_weeks: "Weeks 4–10:"
  test_work: "Compare Glean with current search on matched tasks. Check access permissions, see who keeps using Glean, and record where it can’t help."
  review_weeks: "Weeks 11–12:"
  review_work: "Review the results with the researchers and check the quote. Decide what to expand, what needs another test, and whether to try hybrid."
  what_glean_needs_to_prove: "What Glean needs to prove"
  speed_label: "Time to a verified answer"
  25_less_time: "25% less time"
  on_30_matched_tasks_including_citation: "on 30 matched tasks, including citation checks."
  speed_source: "Microsoft benchmark"
  accuracy_label: "Correct, cited answers"
  at_least_27_of_30: "At least 27 of 30"
  with_no_drop_versus_current_search: ", with no drop versus current search."
  permissions_label: "Access to restricted records"
  permissions_result: "0 disclosures in 20 checks."
  coverage_label: "Critical lab workflows"
  3_of_3_covered: "3 of 3 covered."
  usage_label: "Repeat usage"
  at_least_60: "At least 60%"
  active_in_both_final_weeks: "active in both final weeks."
  benchmarks_heading: "Where the benchmarks come from"
  microsoft_result: "25% less time (24 to 18 min)"
  microsoft_context: "to find information in a randomized Microsoft Copilot study"
  microsoft_source: "Microsoft study"
  microsoft_application: ". I used that as the starting target for research tasks."
  setup_estimate: "1–3 weeks"

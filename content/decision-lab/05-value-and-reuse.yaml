sequence:
  step: "Pilot plan"
  title: "How I'd run the pilot"
  intro: "Continuing our fictional pilot with Glean, I’d run a 12-week pilot with 24 researchers to find out whether Glean helps them get to a verified answer faster on the lab workflows they rely on."
  ceo_ask: "My ask to the CEO: fund the pilot and agree on priority change"
  investment_label: "Investment: €120k–€178k."
  investment_basis: "This planning range assumes 4 full-time team members for 3 months at €10k–€14k per person per month (€120k–€168k), plus €0–€10k for tools. It excludes unquoted Glean license fees. I’d get the vendor quote before asking for approval of the full amount."
  capacity_label: "Capacity: four people full-time for 12 weeks."
  capacity_impact: "The tiger team would step away from its existing work for the quarter. Together with them, I’d capture the impact of re-prioritization, eg. what timelines would slip, who would be affected, and the revised dates. I’d ask the CEO to approve re-prioritization alongside the budget."
  tradeoff_label: "Example trade-off."
  tradeoff: "Delay the new self-service portal for routine lab IT requests by one quarter, as this change primarily tackles technical debt. Any efficiency benefits are minor - researchers would keep using the existing help desk to request software or report workstation issues. I’d protect work tied to regulated lab systems and safety-critical support."
  who_i_d_ask_to_run: "Who I’d ask to run the pilot"
  team_intro: "I’d ask who wants to spend a quarter on the pilot. People can come from any team. I need"
  team_roles: "1 product manager, 2 senior engineers and 1 junior engineer"
  i_d_ask_their_managers_to: ". I’d ask their managers to confirm which commitments would move and who would be affected."
  setup_weeks: "Weeks 1–3:"
  setup_work: "Agree with 24 researchers which tasks to test, time how they do them today, and get approval to connect the sources they need."
  test_weeks: "Weeks 4–10:"
  test_work: "Compare Glean with existing search on matched tasks. Check access permissions, see who keeps using Glean, and record where it can’t help."
  review_weeks: "Weeks 11–12:"
  review_work: "Review the results with the researchers and check the quote. Decide what to expand, what needs another test, and whether to test the hybrid approach."
  what_glean_needs_to_prove: "What Glean needs to prove"
  speed_label: "Time to a verified answer"
  25_less_time: "25% less time"
  on_30_matched_tasks_including_citation: "on 30 matched tasks, including citation checks."
  speed_source: "Microsoft benchmark"
  accuracy_label: "Correct, cited answers"
  at_least_27_of_30: "At least 27 of 30"
  with_no_drop_versus_current_search: ", with no drop versus existing search."
  permissions_label: "Access to restricted records"
  permissions_result: "0 disclosures in 20 checks."
  coverage_label: "Critical lab workflows"
  3_of_3_covered: "3 of 3 covered."
  usage_label: "Repeat usage"
  at_least_60: "At least 60%"
  active_in_both_final_weeks: "active in both final weeks."
  benchmarks_heading: "Where the benchmarks come from"
  microsoft_result: "25% less time (24 to 18 min)"
  microsoft_context: "to find information in a randomized Microsoft Copilot study"
  microsoft_source: "Microsoft study"
  microsoft_application: ". I used that as the starting target for research tasks."
  setup_estimate: "1–3 weeks"

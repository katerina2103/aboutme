  blue_ranges_assumed_outcomes_with_reuse_navy: Blue ranges = assumed outcomes with reuse; navy
    markers = baseline. Each row has its own scale. *No milestone gain if wet-lab work or approvals
    determine delivery.
  what_earns_the_next_investment: What earns the next investment?
  validate_sustained_adoption_and_net_time_saved: Validate whether scientists keep using the tool and
    save time after review. Test transfer with a second team before assuming reuse will help. Keep
    milestone gains separate from annual capacity to avoid counting the same benefit twice.
  assumptions_calculation_and_limits: Assumptions, calculation and limits
  annual_capacity_600_scientists_46_weeks_adoption: "Annual capacity = 600 scientists × 46 weeks ×
    adoption × (weekly search hours × reduction − added weekly review hours). Cautious: 40%, 5h,
    15%, 0.5h = 2,760h. Working: 60%, 6h, 25%, 0.5h = 16,560h. Upside: 80%, 7h, 35%, 0.4h = 45,264h.
    Scenario points use unrounded values on a zero-based scale; labels are rounded."
  the_5_7h_baseline_and_15_35: The 5–7h baseline and 15–35% reduction are assumptions, not study
    averages or pilot results. At an assumed €70/hour, gross capacity value is about €0.2m / €1.2m /
    €3.2m before ongoing costs. This is opportunity cost, not payroll savings, revenue or financial
    return. Budget is only released through an explicit redeployment or spending decision.
  reuse_assumes_connectors_access_rules_evidence_templates: Reuse assumes connectors, access rules,
    evidence templates and evaluation sets transfer to a new product line of 100 scientists. A
    16-week evidence-workflow baseline could become 10–14 weeks. New data formats, scientific
    entities or permissions could eliminate the gain.
  a_24_week_research_milestone_could_shorten: A 24-week research milestone could shorten by 1–2 weeks
    if four weeks of evidence preparation sit on the critical path and fall by 25–50%. If wet-lab
    work or approvals dominate, milestone gain is zero. Each reuse row has its own zero-based weeks
    scale. Blue ranges show assumed outcomes, not forecasts.
  validate_adoption_search_time_and_review_cost: "Validate adoption, search time and review cost in
    the pilot. Test transfer to a second team. Do not add milestone gains to annual capacity: the
    same benefit may be counted twice."

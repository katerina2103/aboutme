  test_against_a_real_alternative: Test against a real alternative
  compare_an_existing_estate_vendor_with_improved: Compare an existing-estate vendor with improved search on the same scientific tasks.
  value_3: "3"
  decide_at_week_eight: Decide in week 12
  use_measured_value_quality_and_ownership_costs: Review the measured value, quality, and cost with the
    people accountable for the next step. Decide whether to expand, narrow the test or stop.
  proposed_funding_gates: Proposed funding gates
  evidence_required_for_more_investment: Evidence required for more investment
  value_20: ≥20%
  net_preparation_time_reduction_vs_improved_search: Net preparation-time reduction vs improved search
  quality: Quality
  no_material_quality_loss_verifiable_support_for: No material quality loss; verifiable support for material claims
  access: Access
  no_unauthorized_disclosure_in_adversarial_tests: No unauthorized disclosure in adversarial tests
  pass: Pass →
  scope_the_next_investment: Scope the next investment
  unclear: Unclear ↻
  run_a_narrower_test: Run a narrower test
  fail: Fail ■
  stop_if_review_effort_erases_gains: Stop if review effort erases gains
  proposed_gates_not_reported_results_report_task: These are proposed criteria, not reported results.
    Show differences between tasks and users, including uncertainty. Inconclusive evidence calls for
    a more focused test, not an automatic rollout.
  pilot_cost_breakdown_and_team_requirements: Pilot cost breakdown and team requirements
  proposed_team_4_5_fte_equivalent_across: "Proposed team: 4 full-time members — 1 product manager, 2 senior engineers, and
    1 junior engineer — with security, UX, evaluation expertise, and researcher participation
    arranged as needed."
  planning_calculation_4_5_fte_equivalent_2: "Planning calculation: 4 full-time team members × 3 months ×
    €10–14k per person-month, plus €0–10k tools = €120k–€178k. Unquoted vendor license
    fees are excluded. Secure senior engineering capacity before starting."
  this_is_a_pilot_estimate_not_a: This is a pilot estimate, not a supplier quote or rollout budget.
    The next investment depends on the week-12 evidence review.
  accountability_and_ownership: Accountability and ownership
  scientists_own_usefulness_and_review_data_owners: Researchers own usefulness and review. Data owners
    own access and metadata. Engineering owns supportability. Finance challenges the capacity
    assumptions. The CEO backs the decision process. Before starting, agree who will act on the
    findings and how participants will hear what changed.
  choose_a_hybrid_only_where_a_demonstrated: Choose a hybrid only where a demonstrated gap justifies
    ownership. Agree the next scope and its budget after the pilot; the initial €120k–€178k is not a
    full-rollout cost.


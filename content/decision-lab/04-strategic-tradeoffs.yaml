glean_name: "Glean"
glean_status: "Pilot first"
glean_reason: "Existing connectors could get us to a pilot fastest. Lab-system fit still needs proof, vendor fees are unquoted, and switching later may be costly."
hybrid_name: "Hybrid"
hybrid_status: "Keep in reserve"
hybrid_reason: "Owning retrieval and evaluation gives us the most flexibility. Building and operating connectors raises cost and slows onboarding."
custom_name: "Own build"
custom_status: "Drop from shortlist"
custom_reason: "Tailored workflows score well, but the largest team and longest lead time would divert investment from our biotech value proposition."
recommendation: "I chose Glean because it best fits the immediate goal: getting acquired teams to usable evidence quickly. I kept hybrid in reserve for its flexibility and dropped own build to protect time and investment for work that differentiates our biotech business."
challenge: "If Glean can’t connect critical lab sources and return useful, correctly permissioned evidence quickly, or the full quote undermines the business case, I’d reassess hybrid against those same requirements before funding rollout."

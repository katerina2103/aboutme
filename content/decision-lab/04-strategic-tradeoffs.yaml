label: Strategic trade-offs
title: Which option best aligns with our strategic objectives?
intro: "I am considering three options scored using assumed criteria. How do they comapre based the strategic priority we pursue as a business?"
comparison_label: "Strategic investment comparison"
priority_heading: "Choose a strategic direction to rank by"
summary_heading: "What the scores show"
recommendation_heading: "My call: pilot Glean first"
calculation_heading: "See criteria, weights and calculation"
criterion_heading: "Decision criterion"
acquisition_summary: "Glean looks like the best option, though its lead over the hybrid approach does not justify a vendor commitment. Validate process and IT landscape fit before committing."
acquisition_label: "Ease of onboarding a new acquisition"
scientific_summary: "The hybrid approach leads when flexibility for researchers’ processes matters most. That does not yet mean a custom build will pay off: validate the specific workflow gap and full maintenance cost."
scientific_label: "Business process fit"
cost_summary: "Glean leads provisionally under stronger cost discipline. Vendor fees remain approximate; obtain a full quote and understand the total cost of ownership before committing to a rollout."
cost_label: "Long-term cost"
glean_name: "Glean"
glean_status: "Pilot first"
glean_reason: "Existing connectors could get us to a pilot the fastest. Lab-system fit still needs testing, vendor fees are unquoted, and switching later may be costly."
hybrid_name: "Hybrid"
hybrid_status: "Keep in reserve"
hybrid_reason: "Owning retrieval and evaluation gives us the most flexibility. Building and operating connectors raises cost and slows time to value."
custom_name: "Own build"
custom_status: "Drop from shortlist"
custom_reason: "Tailored workflows score well, but the largest cost and longest lead time would divert investment from our biotech value proposition."
recommendation: "I chose Glean because it best fits the immediate goal: getting researchers to valuable information quickly. I kept the hybrid approach in reserve for its flexibility and dropped a full custom build to protect time and investment for work that truly differentiates our biotech business, even though I realize that is not what my CEO would want to hear. If Glean can’t connect critical lab sources and return useful, correctly permissioned evidence quickly, or the full quote undermines the business case, I’d reassess hybrid against those same requirements before funding rollout."
build_table_label: "Build"
criterion_1: "Ease of onboarding a new acquisition"
criterion_2: "Business process fit"
criterion_3: "3-year economics"
criterion_4: "Data governance"
criterion_5: "Exit flexibility"
calculation_note: "Weighted score = sum of criterion scores (1–5) multiplied by their weights. The assumptions are preliminary; governance, permission safety and permitted processing locations remain non-negotiable gates, not offsets in the score."
scenario_note: "This model tests strategic priorities, not product performance. Acquisition-specific source onboarding, scientific quality and complete supplier pricing must be verified before an investment decision."
ceo_challenge_heading: "CEO challenge"
ceo_question: "“Why don’t we build something ourselves? Our business is unique.”"
ceo_response_label: "My response."
ceo_response: "I’d rather invest in research that give us an edge. Building the whole new solution would tie up engineers before we know where vendor options fall short. I’d pilot Glean first. If we find a recurring gap that slows researchers down, I’d test whether the hybrid approach can close it at a cost we can justify."

acquisition_summary: "Glean narrowly leads. A 0.05-point difference from hybrid does not justify a supplier commitment. Validate scientific access and acquisition integration before deciding."
acquisition_label: "Acquisition speed"
scientific_summary: "Hybrid leads when scientific differentiation matters most. That does not yet prove custom ownership will pay off: validate the specific workflow gap and full maintenance cost."
scientific_label: "Scientific fit"
cost_summary: "Glean leads provisionally under stronger cost discipline. Vendor fees remain incomplete; obtain a full quote and test total cost before approving a rollout."

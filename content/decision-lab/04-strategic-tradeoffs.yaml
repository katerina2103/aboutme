calculation_note: "Weighted score = sum of criterion scores (1–5) multiplied by their weights. The assumptions are preliminary; governance, permission safety and permitted processing locations remain non-negotiable gates, not offsets in the score."
scenario_note: "This model tests strategic priorities, not product performance. Acquisition-specific source onboarding, scientific quality and complete supplier pricing must be verified before an investment decision."

  additional_criteria:
    - label: "Scientific application integration"
      cells:
        - option: copilot
          summary: "Custom synced connectors"
          detail: "Index external data with source permissions."
          source_url: https://learn.microsoft.com/en-us/microsoft-365/copilot/connectors/overview
        - option: glean
          summary: "Benchling integration (beta)"
          detail: "Listed as Push API / MCP; supports research notes and experiment status."
          source_url: https://www.glean.com/connectors/benchling
        - option: benchling
          summary: "REST API + Benchling Apps"
          detail: "Connect external systems and lab instruments; read and write data."
          source_url: https://docs.benchling.com/docs/developer-platform-overview
        - option: haystack
          summary: "Model and database integrations"
          detail: "Custom components support additional sources; we maintain lab connectors."
          source_url: https://docs.haystack.deepset.ai/docs/integrations
        - option: custom
          summary: "Build our own connectors"
          detail: "Our team owns integrations, permissions and maintenance."
    - label: "Vendor lock-in"
      cells:
        - option: copilot
          summary: "Interaction export via Purview"
          detail: "Exporting conversations does not migrate the complete workflow."
          source_url: https://learn.microsoft.com/en-us/purview/ai-m365-copilot
        - option: glean
          summary: "Document retrieval API"
          detail: "Retrieves permission-visible indexed documents; a full migration needs a separate plan."
          source_url: https://developers.glean.com/api/platform-api/documents-overview
        - option: benchling
          summary: "Data export via REST API"
          detail: "Data access is documented; workflow and schema migration still require planning."
          source_url: https://docs.benchling.com/docs/developer-platform-overview
        - option: haystack
          summary: "Pipelines saved as YAML"
          detail: "Configuration can be saved and reloaded; custom components and services remain dependencies."
          source_url: https://docs.haystack.deepset.ai/docs/serialization
        - option: custom
          summary: "Control our code and interfaces"
          detail: "Cloud, model and key-person dependencies remain."
    - label: "Data sovereignty"
      cells:
        - option: copilot
          summary: "Local-region storage commitments"
          detail: "Eligible tenants and subscriptions; these commitments concern data at rest."
          source_url: https://learn.microsoft.com/en-us/microsoft-365/enterprise/m365-dr-service-copilot-offerings?view=o365-worldwide
        - option: glean
          summary: "Netherlands GCP hosting option"
          detail: "europe-west4 is a preferred region; model-service location must be chosen separately."
          source_url: https://docs.glean.com/get-started/build/gcp/supported-gcp-regions
        - option: benchling
          summary: "EU Central hosting available"
          detail: "LLM features use third-party inference providers."
          source_url: https://help.benchling.com/hc/en-us/articles/39953690790669-Benchling-security-overview
          detail_source_url: https://help.benchling.com/hc/en-us/articles/20901323667853-Data-protection-and-security-for-AI-at-Benchling
        - option: haystack
          summary: "Choose hosting and model services"
          detail: "Our architecture must control where each provider processes research data."
        - option: custom
          summary: "Choose infrastructure and providers"
          detail: "Our team must enforce storage, processing and access requirements."
  verification_checks:
    - label: "Scientific application integration"
      text: "Demonstrate our electronic lab notebook (ELN), lab information management system (LIMS) and scientific analysis workflow. Check source permissions, citations, freshness and whether the task needs read-only access or write-back."
    - label: "Vendor lock-in"
      text: "Run an export-and-rebuild exercise. Check which records, metadata, permissions, configurations and evaluation sets we can take with us, what must be recreated, and the cost and time to leave."
    - label: "Data sovereignty"
      text: "For our European company, agree permitted countries for storage, processing and remote support access. Check content, embeddings, prompts, outputs, logs and backups, along with key control and all model providers. Confirm these requirements in the proposed deployment and agreement."
    - label: "Decision"
      text: "A critical integration or data-control failure removes a vendor from the shortlist. Consider hybrid or custom only for a demonstrated gap worth maintaining."
  supporting_sources:
    - label: "Microsoft connectors"
      url: https://learn.microsoft.com/microsoft-365/copilot/connectors/overview
    - label: "Microsoft residency"

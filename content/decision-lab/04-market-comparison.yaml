  visual_guide_cost: "The left edge is the lower estimate and the right edge is the upper estimate. Buy-route ranges omit unquoted supplier fees and listed extras; the bars do not establish a cheapest complete solution."
  visual_guide_coverage: "Linked capabilities come from vendor documentation reviewed on 13 November 2026; they describe available features, not completed tests on our systems. Migration and custom-build trade-offs are my assessment. European hosting does not by itself establish control over every model service, support access or data flow."

  additional_criteria:
    - label: "Scientific application integration"
      cells:
        - option: copilot
          summary: "Prebuilt / custom connectors"
          detail: "Demonstrate our ELN, LIMS and analysis access"
        - option: glean
          summary: "Native / custom connectors"
          detail: "Verify coverage of our actual research applications"
        - option: benchling
          summary: "Benchling APIs and apps"
          detail: "Prove external-system coverage; AI scope separately"
        - option: haystack
          summary: "Custom components available"
          detail: "Our team must deliver and maintain lab connectors"
        - option: custom
          summary: "Designed for our workflows"
          detail: "Our team builds connectors and permission checks"
    - label: "Vendor lock-in"
      cells:
        - option: copilot
          summary: "Microsoft-specific configuration"
          detail: "Verify export and rebuild effort"
        - option: glean
          summary: "Vendor-managed index and setup"
          detail: "Test export and reconstruction outside Glean"
        - option: benchling
          summary: "Platform data model and workflows"
          detail: "Test API exports and what must be rebuilt"
        - option: haystack
          summary: "Components can be replaced"
          detail: "Model, database and API dependencies remain"
        - option: custom
          summary: "Control our code and interfaces"
          detail: "Cloud, model and key-person dependencies remain"
    - label: "Data sovereignty"
      cells:
        - option: copilot
          summary: "Verify tenant + model regions"
          detail: "Check permitted countries and cross-border access"
        - option: glean
          summary: "Verify deployment + model regions"
          detail: "Check permitted countries and cross-border access"
        - option: benchling
          summary: "Verify platform + AI regions"
          detail: "Check permitted countries and cross-border access"
        - option: haystack
          summary: "Specify permitted regions"
          detail: "Verify hosted-model processing and remote access"
        - option: custom
          summary: "Specify permitted regions"
          detail: "Check every provider, backup and support location"
  verification_checks:
    - label: "Scientific application integration"
      text: "Demonstrate our electronic lab notebook (ELN), lab information management system (LIMS) and scientific analysis workflow. Check source permissions, citations, freshness and whether the task needs read-only access or write-back."
    - label: "Vendor lock-in"
      text: "Run an export-and-rebuild exercise. Check which records, metadata, permissions, configurations and evaluation sets we can take with us, what must be recreated, and the cost and time to leave."
    - label: "Data sovereignty"
      text: "For our European company, agree permitted countries for storage, processing and remote support access. Check content, embeddings, prompts, outputs, logs and backups, along with key control and all model providers. Confirm these requirements in the proposed deployment and agreement."
    - label: "Decision"
      text: "A critical integration or data-control failure removes a vendor from the shortlist. Consider hybrid or custom only for a demonstrated gap worth maintaining."

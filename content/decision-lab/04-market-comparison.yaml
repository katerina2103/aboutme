    - label: "Glean deployment"
      url: https://docs.glean.com/get-started/build/about-self-hosted
    - label: "Benchling integration and export"
      url: https://docs.benchling.com/docs/developer-platform-overview
    - label: "Haystack integrations"
      url: https://docs.haystack.deepset.ai/docs/integrations

- title: Product leadership
  body: I'm interested in product leadership roles where teams need to decide what
    to build, demonstrate its value, and help people use it in their work.
  action: Discuss a product leadership opportunity
- title: A difficult problem is a good place to start.
  body: Let’s explore a product opportunity, investigate a data or operational
    challenge, or turn a broad ambition into a focused experiment. I bring
    curiosity, constructive challenge and a practical approach to moving
    forward.
  action: Discuss a collaboration

answers:
  build:
    assessment: "Build: control can create strategic value, but limited software engineering makes
      delivery and upkeep risky. I would first test whether a scientific need justifies owning the
      software."
    challenge: Am I dismissing a strategic capability because the team is small today? A tightly scoped
      internal product could build expertise and protect differentiated scientific workflows. A
      pilot must not become an excuse to avoid that commitment.
    change: I would move from option 3 to building if a repeatable scientific need is beyond vendor
      capabilities, a senior engineering team is committed, and a scoped prototype demonstrates
      enough value to justify three-year ownership costs.
  buy:
    assessment: "Buy: a reasonable route to faster delivery when existing tools fit. Test lab
      connectors, permissions, source support and total cost first; procurement alone does not solve
      scattered knowledge."
    challenge: Am I adding unnecessary experimentation when an existing product already solves this? A
      short, real-data vendor evaluation could be enough. Rebuilding mature search capabilities
      would waste time scientists could use now.
    change: I would move from option 3 directly to a bounded vendor rollout if an evaluation on our
      tasks proves useful answers, correct access controls and source coverage, with lower total
      cost than the alternatives and committed users.
  test:
    assessment: "Compare a narrow pilot with better search. This is my choice: commit users and owners,
      compare AI with a simpler workflow, and make a funding decision after eight weeks."
    challenge: Am I funding a pilot before proving AI matters—or creating another round of discovery?
      Improved search must be a real comparator. Agree who will act on the evidence and when; a
      polished demo is not the outcome.
    change: I would stop the AI route if improved search performs as well, correction effort erases the
      gain, or scientists do not return. I would choose a vendor or custom build only when the same
      task evidence and ownership costs justify it.

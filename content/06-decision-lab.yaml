answers:
  build:
    assessment: Building could give us control over a scientific workflow that matters. But our
      engineering capacity is limited, so I would first establish what we need to own and whether we
      can support it.
    challenge: Am I ruling out a valuable capability because the team is small today? A focused internal
      product could build expertise. The pilot should help us make that commitment, not become a way
      to postpone it.
    change: I would choose a custom build if a recurring scientific need exceeds vendor capabilities,
      senior engineers are committed, and a prototype shows enough value to justify three years of
      ownership.
  buy:
    assessment: Buying could be the quickest useful step if the product fits the work. I would test our
      sources, permissions and scientific tasks, then compare full costs. Procurement alone will not
      resolve inaccessible knowledge.
    challenge: Am I asking for more experimentation when a product already does the job? A short
      evaluation on our own tasks may be enough. Scientists should not wait while we rebuild
      something we can use.
    change: I would move to a limited vendor rollout if the same task tests show useful answers, correct
      access and source coverage, at a lower total cost than the alternatives. The users and owners
      must be ready to commit.
  test:
    assessment: I would compare a focused AI pilot with better search. Agree the participants, the
      decision and the evidence needed, then review funding after eight weeks. We need a test that
      can change the plan.
    challenge: Am I testing whether AI helps, or just funding another round of discovery? Better search
      needs a fair comparison. Agree who will act on the evidence and when, before the pilot starts.
    change: I would stop the AI route if improved search performs as well, review effort erases the
      gain, or scientists do not return. I would choose a vendor or custom build when the task
      evidence and ownership costs support it.

  curious_how_i_think: Work through a product decision with me
  meet_our_fictional_biotech_company: Meet our fictional statistically average biotech company
  value_2_000_employees_600_scientists_lab_records: 2,000 employees. 600 researchers. Lab records, reports and knowledge scattered across teams and systems. Fast-growing, regulated and ambitious.
  the_ceo_s_brief: The CEO’s brief
  build_an_ai_assistant_for_our_scientists: “Build an AI assistant for our researchers. We have enough
    data scientists, although we have little software engineering expertise, and I want us to be an AI frontrunner. We might expand considerably next year”
  how_much_investment_do_you_need: “When can you make this happen?”
  there_is_no_agreed_budget_i_take: That is a sizeable ask without agreed budget. I take this seriously and want to find out
    which processes do we need to improve and what the benefits are. In this way, we first can build confidence in the direction before a substantial investment is made. Where would you start? 🙂
  a_fictional_case_to_illustrate_my_reasoning: A fictional case to illustrate my decisioning philosophy. The company, budgets and outcomes are hypothetical.
answers:
  build:
    assessment: Building could give us control over a scientific workflow that matters. But our
      engineering capacity is limited, so I would first establish what we need to build and whether we
      can support it.
    challenge: Am I ruling out a valuable capability because the team is small today? A focused internal
      product could build expertise. The time-boxed pilot should help us make that commitment, not become a way
      to postpone it.
    change: I would choose a custom build if a recurring scientific need considerably exceeds vendor capabilities,
      senior engineers are committed, and a prototype shows enough value to justify three years of
      investment.
  buy:
    assessment: Off-the-shelf solution could be the quickest route if the product solve the problem at hand. I would test our
      data sources, permissions and scientific tasks, then compare full costs. Product alone will not
      resolve inaccessible knowledge.
    challenge: Am I asking for more experimentation when a product already does the job? A short
      evaluation on our own tasks may be enough. Researchers should not wait while we rebuild
      something that a vendor can provide.
    change: I would move to a limited vendor rollout if the same task tests show accurate answers, correct
      access controls and source coverage, at a lower total cost than the alternatives. The oragnization
      must be ready to commit.
  test:
    assessment: I would compare a focused AI pilot with better search. Agree the participants, the
      hypothesis and the evidence needed, then review funding after 8-10 weeks. We need a test that
      can change the plan.
    challenge: Am I testing whether AI helps, or just funding another round of discovery? Better search
      needs a fair comparison. Agree who will act on the evidence and when, before the pilot starts.
    change: I would stop the AI route if improved search performs just as well, review effort erases the
      gain, or researchers will not t use it. I would choose a vendor or custom build when the task
      evidence and total ownership costs support it.

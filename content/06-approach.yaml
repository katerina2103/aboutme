# Approach: "How I work" (nav "Approach" jumps here).
#
# `principles` is the FULL list. Principles with `show_on_page: true` appear as
# cards on the page; the "Explore my … principles" link opens an overlay with all of them.
# Numbers follow the list order. {count} in a text is replaced by the number of principles.

title: How I work
introduction: My background in science taught me to work through uncertainty with little data. Analytics work taught me that data is only insightful when people can use it to make a decision. My product career taught me that even a bad decision is better than no decision - the best way to find out is to fail fast to succeed even faster. 

side_link:
  label: Explore my {count} principles ↗

# The overlay that opens from the link above
overlay:
  small_heading: How I operate
  title: My {count} principles
  introduction: The working principles behind how I approach problems, decisions and teams.

principles:
  - title: Understand before change.
    text: Get close to the actual work. Find its purpose, what already works and what causes friction.
    show_on_page: true
  - title: Questions is just a tool to understand.
    text: Challenge assumptions constructively. Explain the tradeoffs and test whether the opportunity is worth pursuing.
    show_on_page: true
  - title: Analysis, but not decision paralysis.
    text: Agree what hypothesis to test, what decision to derive and who is sufficiently to be part of the experiment.
    show_on_page: true
  - title: Bring people into the change.
    text: Listen carefully, share knowledge humbly. Invite different perspectives and convert participation into action.
    show_on_page: true
  
  - title: Stay persistent. Adapt the approach.
    text: When progress stalls, understand what is blocking it and find another way forward. 
    Keep going while the goal still makes sense.

  - title: Think for yourself. Stay open to being wrong.
    text: Listen carefully, then form your own judgment. Explain your reasoning
      and change your mind when the evidence calls for it.

  - title: Look for the problem behind the request.
    text:  Take requests seriously and ask what prompted them. A requested feature
      is a starting point for understanding what someone needs to achieve.

  - title: Make the value concrete.
    text:  Be clear about who benefits, what improves for them, and why it matters
      to the business. Find evidence for those claims before asking for a
      bigger commitment.

  - title: Build in steps that teach us something.
    text:  Choose the smallest useful change that can test an assumption in
      practice. Use what happens to decide whether to expand, adjust, or stop.

  - title: Decide before certainty arrives.
    text:  Make the call with the evidence available. Be explicit about what is
      uncertain, who carries the consequences, and what would make you
      reconsider.

  - title: Know today. Make room for tomorrow.
    text:  Understand current constraints and investigate what is changing.
      Set a direction that helps people act now and recognise when it
      needs to change.

  - title: Give promising ideas a fair test.
    text:  Turn an opportunity into a focused experiment with people willing
      to commit time to it. Agree what result would justify taking it further.

  - title: Make participation count.
    text:  Ask whose perspective is missing, especially among people affected
      by the decision. Explain how their input shaped the next step and
      who will take it.

  - title: Be the partner who asks the awkward question.
    text:  Speak up when the evidence is weak or the proposed solution misses
      the problem. Explain why it matters and help work through a better
      option, even when the plan is your own.

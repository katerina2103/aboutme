title: How I operate
introduction: >-
  My background in science taught me to work through uncertainty with little data.
  Analytics work taught me that data is only insightful when people can use it to
  make a decision. My product career taught me that even a bad decision is better
  than no decision - the best way to find out is to fail fast to succeed even faster.

side_link:
  label: Explore my {count} principles ↗

overlay:
  small_heading: How I operate
  title: My {count} principles
  introduction: The working principles behind how I approach problems, decisions and teams.

principles:
  - title: Understand before change.
    text: >-
      Get close to the actual work. Find its purpose, what already works and what causes friction.
    show_on_page: true

  - title: Question is just a tool to understand.
    text: >-
      Challenge assumptions constructively. Explain the tradeoffs and test whether
      the opportunity is worth pursuing.
    show_on_page: true

  - title: Analysis, but not decision paralysis.
    text: >-
      Agree what hypothesis to test, what decision to derive and who is sufficiently
      to be part of the experiment.
    show_on_page: true

  - title: Bring people into the change.
    text: >-
      Listen carefully, share knowledge humbly. Invite different perspectives and
      convert participation into action.
    show_on_page: true

  - title: Be resiliant. Adapt.
    text: >-
      When progress stalls, understand what is blocking it and find another way
      forward. When the goal makes sense - keep going.

  - title: The goal is not being right or wrong, but reach objectives.
    text: >-
      Listen carefully, then form your own judgment. Explain your reasoning
      and change your stance when the evidence proves otherwise.

  - title: Look for the question behind the question.
    text: >-
      Take requests seriously and ask what prompted them. A requested feature
      is a starting point for understanding what someone needs to achieve.

  - title: Make the value concrete.
    text: >-
      Be clear about who benefits, what improves for them, and why it matters
      to the business. Find evidence for those claims before asking for a
      bigger commitment.

  - title: Build in steps that teach us something.
    text: >-
      Choose the smallest useful change that can test an assumption in
      practice. Use what happens to decide whether to expand, adjust, or stop.

  - title: Decide before certainty arrives.
    text: >-
      Make the call with the evidence available. Be explicit about what is
      uncertain, who carries the consequences, and what would make you reconsider.

  - title: Know today. Make room for tomorrow.
    text: >-
      Understand current constraints and investigate what is changing.
      Set a direction that helps people act now and recognise when it needs to change.

  - title: Give promising ideas a fair test.
    text: >-
      Turn an opportunity into a focused experiment with people willing
      to commit time to it. Agree what result would justify taking it further.

  - title: Show participation matters.
    text: >-
      Ask whose perspective is missing, especially among people affected
      by the decision. Explain how their input shaped the next step and who will take it.

  - title: Be the partner who asks the awkward question.
    text: >-
      Speak up when the evidence is weak or the proposed solution misses
      the problem. Explain why it matters and help work through a better
      option, even when the plan is your own.
